spring:
  application:
    name: BE

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  profiles:
    default: local

  #
  #
  sql:
    init:
      mode: ${SQL_INIT_MODE:never}
      continue-on-error: false
      data-locations:
        - classpath:db/seed/V01_base.sql
        - classpath:db/seed/V02_warehouse_1.sql
        - classpath:db/seed/V05_inventory.sql
        - classpath:db/seed/V06_product_catalog.sql
        - classpath:db/seed/V07_box_storage_model.sql
        - classpath:db/seed/V08_three_level_rack_storage.sql
        - classpath:db/seed/V09_remove_expiry.sql
        - classpath:db/seed/V10_guest_warehouse_ownership.sql
        - classpath:db/seed/V11_simulation_execution_version.sql
        - classpath:db/seed/V12_user_account_management.sql
        - classpath:db/seed/V13_board_post_attachment.sql

  jpa:
    defer-datasource-initialization: true

mail:
  from: ${MAIL_FROM:${MAIL_USERNAME:}}

storage:
  s3:
    region: ${AWS_REGION:ap-northeast-2}
    bucket: ${S3_BUCKET_NAME:laro-board-attachments}

auth:
  email-verification:
    code-ttl: ${EMAIL_VERIFICATION_CODE_TTL:5m}
    resend-cooldown: ${EMAIL_VERIFICATION_RESEND_COOLDOWN:60s}
    token-ttl: ${EMAIL_VERIFICATION_TOKEN_TTL:10m}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
  guest-access-token-expiration-ms: ${JWT_GUEST_ACCESS_TOKEN_EXPIRATION_MS:3600000}
  refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:1209600000}
  refresh-cookie-secure: ${JWT_REFRESH_COOKIE_SECURE:true}

fastapi:
  base-url: http://localhost:8000

# 시뮬레이션 재생 엔진
simulation:
  playback:
    tick-ms: 100
  command-generation:
    workload-multiplier-weights: ${SIMULATION_COMMAND_GENERATION_WORKLOAD_MULTIPLIER_WEIGHTS:10,15,20,25,30}

management:
  health:
    mail:
      enabled: ${MANAGEMENT_HEALTH_MAIL_ENABLED:false}
