spring:
  application:
    name: BE

  profiles:
    default: local

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:3600000}

fastapi:
  base-url: http://localhost:8000

# 시뮬레이션 재생 엔진
simulation:
  playback:
    # 재생 틱 주기(ms). 값이 작을수록 로봇이 빠르게 움직인다.
    tick-ms: 500
