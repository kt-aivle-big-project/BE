spring:
  application:
    name: BE

  profiles:
    default: local

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
  refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:1209600000}
  refresh-cookie-secure: ${JWT_REFRESH_COOKIE_SECURE:true}

fastapi:
  base-url: http://localhost:8000

# 시뮬레이션 재생 엔진
simulation:
  playback:
    # 재생 틱 주기(ms). 값이 작을수록 로봇이 빠르게 움직인다.
    tick-ms: 500
