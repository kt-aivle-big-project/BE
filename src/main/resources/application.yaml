spring:
  application:
    name: BE

  profiles:
    default: local

  # 시작할 때 기본 데이터를 자동으로 넣는다.
  #
  # 없으면 창고·노드가 비어 있어서 화면도 시뮬레이션도 동작하지 않는다.
  # 조원마다 수동으로 SQL 을 넣어야 했던 문제를 없앤다.
  #
  # V02는 공용 기본 지도의 계약을 upsert하되, storage_location과 재고 행은 보존한다.
  # 나머지 카탈로그/재고 시드는 "이미 있으면 건너뛴다" 방식으로 기존 값을 지킨다.
  sql:
    init:
      mode: ${SQL_INIT_MODE:never}
      continue-on-error: false
      data-locations:
        - classpath:db/seed/V01_base.sql
        - classpath:db/seed/V02_warehouse_1.sql
        - classpath:db/seed/V05_inventory.sql
        - classpath:db/seed/V06_product_catalog.sql
        - classpath:db/seed/V07_box_storage_model.sql
        - classpath:db/seed/V08_three_level_rack_storage.sql
        - classpath:db/seed/V09_current_warehouse_state.sql

  jpa:
    # Hibernate 가 테이블을 만든 뒤에 위 SQL 이 실행되도록 미룬다.
    # 이 설정이 없으면 테이블이 없는 상태에서 INSERT 가 돌아 실패한다.
    defer-datasource-initialization: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
  refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:1209600000}
  refresh-cookie-secure: ${JWT_REFRESH_COOKIE_SECURE:true}

fastapi:
  base-url: http://localhost:8000

# 시뮬레이션 재생 엔진
simulation:
  playback:
    # 재생 틱 주기(ms). 값이 작을수록 로봇이 빠르게 움직인다.
    tick-ms: 100
  command-generation:
    # 1x, 2x, 3x, 4x, 5x workload relative weights. Values need not total 100.
    workload-multiplier-weights: ${SIMULATION_COMMAND_GENERATION_WORKLOAD_MULTIPLIER_WEIGHTS:10,15,20,25,30}
