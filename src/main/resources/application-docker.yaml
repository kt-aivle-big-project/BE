spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: redis
      port: 6379

  neo4j:
    uri: bolt://neo4j:7687
    authentication:
      username: ${NEO4J_USER}
      password: ${NEO4J_PASSWORD}

server:
  port: 8080