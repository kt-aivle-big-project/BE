<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Simulation WebSocket Test</title>
    <style>
        body { font-family: sans-serif; max-width: 960px; margin: 32px auto; padding: 0 16px; }
        .controls { display: flex; gap: 8px; margin-bottom: 16px; }
        input, button { padding: 8px 12px; }
        #status { margin: 12px 0; }
        pre { min-height: 320px; padding: 16px; overflow: auto; background: #111827; color: #e5e7eb; }
    </style>
</head>
<body>
<h1>Simulation Robot WebSocket</h1>
<div class="controls">
    <label>Simulation Run ID <input id="runId" type="number" value="9" min="1"></label>
    <button id="connect">연결</button>
    <button id="disconnect" disabled>연결 해제</button>
    <button id="clear">로그 지우기</button>
</div>
<div id="status">연결 안 됨</div>
<pre id="log"></pre>
<script>
    let socket;
    const status = document.getElementById('status');
    const log = document.getElementById('log');
    const connectButton = document.getElementById('connect');
    const disconnectButton = document.getElementById('disconnect');

    function append(value) {
        log.textContent += value + '\n';
        log.scrollTop = log.scrollHeight;
    }

    function frame(command, headers = {}, body = '') {
        const lines = [command];
        Object.entries(headers).forEach(([key, value]) => lines.push(`${key}:${value}`));
        return `${lines.join('\n')}\n\n${body}\0`;
    }

    connectButton.onclick = () => {
        const runId = document.getElementById('runId').value;
        const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
        socket = new WebSocket(`${protocol}://${location.host}/ws-native`);
        status.textContent = '연결 중...';

        socket.onopen = () => socket.send(frame('CONNECT', {
            'accept-version': '1.2',
            'heart-beat': '0,0'
        }));

        socket.onmessage = event => {
            const raw = event.data;
            if (raw.startsWith('CONNECTED')) {
                const destination = `/topic/simulation-runs/${runId}/robots`;
                socket.send(frame('SUBSCRIBE', { id: 'robots-0', destination, ack: 'auto' }));
                status.textContent = `구독 중: ${destination}`;
                connectButton.disabled = true;
                disconnectButton.disabled = false;
                append(`[CONNECTED] ${destination}`);
                return;
            }
            if (raw.startsWith('MESSAGE')) {
                const separator = raw.indexOf('\n\n');
                const body = raw.slice(separator + 2).replace(/\0$/, '');
                try {
                    append(JSON.stringify(JSON.parse(body), null, 2));
                } catch (_) {
                    append(body);
                }
                return;
            }
            append(raw.replace(/\0/g, ''));
        };

        socket.onerror = () => {
            status.textContent = '연결 오류';
            append('[ERROR] WebSocket 연결 실패');
        };
        socket.onclose = () => {
            status.textContent = '연결 안 됨';
            connectButton.disabled = false;
            disconnectButton.disabled = true;
        };
    };

    disconnectButton.onclick = () => {
        if (socket && socket.readyState === WebSocket.OPEN) {
            socket.send(frame('DISCONNECT', { receipt: 'disconnect-0' }));
            socket.close();
        }
    };
    document.getElementById('clear').onclick = () => log.textContent = '';
</script>
</body>
</html>
