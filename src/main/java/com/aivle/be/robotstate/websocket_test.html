<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>LARO 웹소켓 테스트</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<style>
  body { font-family: sans-serif; max-width: 900px; margin: 20px auto; padding: 0 16px; }
  #status { padding: 8px 12px; border-radius: 6px; margin-bottom: 16px; font-weight: bold; }
  .connected { background: #d4edda; color: #155724; }
  .disconnected { background: #f8d7da; color: #721c24; }
  .connecting { background: #fff3cd; color: #856404; }
  .box { border: 1px solid #ddd; border-radius: 6px; padding: 12px; margin-bottom: 12px; }
  .box h3 { margin: 0 0 8px 0; }
  pre { background: #f5f5f5; padding: 8px; border-radius: 4px; max-height: 200px; overflow-y: auto; font-size: 12px; white-space: pre-wrap; word-break: break-all; }
  input { padding: 6px; width: 300px; }
  button { padding: 6px 14px; cursor: pointer; }
</style>
</head>
<body>
  <h2>LARO 웹소켓 테스트</h2>
  <div>
    서버 주소: <input id="url" value="http://localhost:8080/ws">
    <button onclick="connect()">연결</button>
    <button onclick="disconnect()">연결끊기</button>
  </div>
  <div id="status" class="disconnected">연결 안 됨</div>

  <div class="box">
    <h3>/topic/tasks</h3>
    <pre id="tasks"></pre>
  </div>
  <div class="box">
    <h3>/topic/events</h3>
    <pre id="events"></pre>
  </div>
  <div class="box">
    <h3>/topic/simulations</h3>
    <pre id="simulations"></pre>
  </div>
  <div class="box">
    <h3>/topic/robots</h3>
    <pre id="robots"></pre>
  </div>

<script>
let stompClient = null;

function setStatus(text, cls) {
  const el = document.getElementById('status');
  el.textContent = text;
  el.className = cls;
}

function appendMsg(elId, msg) {
  const el = document.getElementById(elId);
  const time = new Date().toLocaleTimeString();
  el.textContent = `[${time}] ${msg}\n\n` + el.textContent;
}

function connect() {
  const url = document.getElementById('url').value;
  const socket = new SockJS(url);
  stompClient = Stomp.over(socket);

  setStatus('연결 중...', 'connecting');

  stompClient.connect({}, function () {
    setStatus('연결됨', 'connected');

    stompClient.subscribe('/topic/tasks', function (message) {
      appendMsg('tasks', message.body);
    });
    stompClient.subscribe('/topic/events', function (message) {
      appendMsg('events', message.body);
    });
    stompClient.subscribe('/topic/simulations', function (message) {
      appendMsg('simulations', message.body);
    });
    stompClient.subscribe('/topic/robots', function (message) {
      appendMsg('robots', message.body);
    });
  }, function (error) {
    setStatus('연결 실패 (콘솔 확인)', 'disconnected');
    console.error(error);
  });
}

function disconnect() {
  if (stompClient !== null) {
    stompClient.disconnect();
  }
  setStatus('연결 끊김', 'disconnected');
}
</script>
</body>
</html>
